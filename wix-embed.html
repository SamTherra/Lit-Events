<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lit Events - Premium Bar & Beverage Service</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Ensure iframe takes full width and height */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Responsive iframe */
        .responsive-iframe {
            position: relative;
            width: 100%;
            height: 100vh;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Replace YOUR_DEPLOYED_URL with your actual deployed website URL -->
    <iframe 
        src="YOUR_DEPLOYED_URL"
        class="responsive-iframe"
        title="Lit Events Website"
        allowfullscreen
    ></iframe>

    <script>
        // Handle responsive iframe resizing
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resize') {
                const iframe = document.querySelector('.responsive-iframe');
                iframe.style.height = event.data.height + 'px';
            }
        });
    </script>
</body>
</html>
